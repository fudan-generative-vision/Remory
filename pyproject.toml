[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "remory-runtime"
version = "0.3.0"
description = "Residual memory at the compaction boundary: inference and harness interfaces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt", "NOTICES.md"]
dependencies = ["numpy>=1.24", "httpx>=0.27,<1"]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jsonschema>=4.22"]
codex = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jsonschema>=4.22", "transformers==5.12.1", "huggingface-hub>=0.34", "safetensors>=0.6"]
transformers = ["torch>=2.13", "transformers==5.12.1", "safetensors>=0.6", "huggingface-hub>=0.34", "accelerate>=1"]
test = ["pytest>=8", "fastapi>=0.115,<1", "jsonschema>=4.22", "ruff>=0.9"]

[project.scripts]
remory = "remory.cli:main"
r-codex = "remory.codex.cli:main"

[project.urls]
Repository = "https://github.com/1ring2rta/Remory"
Weights = "https://github.com/1ring2rta/Remory#models"

[tool.hatch.build.targets.wheel]
packages = ["src/remory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
