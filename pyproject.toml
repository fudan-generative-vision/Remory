[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "r-codex-text"
version = "0.1.0"
description = "Native r-codex with text compaction and OpenAI-compatible model endpoints"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt", "NOTICES.md"]
dependencies = [
    "httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
    "jsonschema>=4.22", "websockets>=15,<17", "wcwidth>=0.2,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
r-codex = "r_codex.cli:main"
r-codex-text = "r_codex.cli:main"

[project.urls]
Repository = "https://github.com/fudan-generative-vision/Remory/tree/codex/text-compact"

[tool.hatch.build.targets.wheel]
packages = ["src/r_codex"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
